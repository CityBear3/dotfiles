[package]
name = "dotfiles-codex-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1"

[dev-dependencies]
tempfile = "3"
